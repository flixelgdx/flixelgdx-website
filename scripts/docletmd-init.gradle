/*
 * Gradle init script -- applies DocletMD to FlixelGDX framework modules.
 *
 * Run this from inside the framework repo directory, e.g.:
 *
 *   ./gradlew :flixelgdx-core:generateDocletMD     \
 *             :flixelgdx-lwjgl3:generateDocletMD    \
 *             :flixelgdx-teavm:generateDocletMD     \
 *             :flixelgdx-android:generateDocletMD   \
 *             -PincludeAndroid=true                 \
 *             -I /abs/path/to/scripts/docletmd-init.gradle \
 *             -PdocletmdOutDir=/abs/path/to/output
 *
 * Because the init script is applied to the framework's own Gradle build,
 * DocletMD is auto-wired to each module's main source set AND its fully
 * resolved compile classpath (libGDX, etc.), so no manual dependency
 * configuration is needed here.
 *
 * Java modules (core, lwjgl3, teavm) are wired via plugins.withId('java').
 * The Android module is wired via plugins.withId('com.android.library') and
 * uses the releaseCompileClasspath configuration for type resolution.
 * The iOS module is excluded; it requires RoboVM which is not available in
 * standard build environments.
 *
 * Knobs:
 *   docletmdOutDir  Absolute path for the output root directory. Per-module
 *                   trees land under <docletmdOutDir>/<slug>/. Defaults to
 *                   <framework-root>/build/docletmd-out.
 */
initscript {
    // When -PdocletmdJarDir points at a local DocletMD build, load the plugin and all of
    // its runtime dependencies straight from that directory. This avoids any repository
    // lookup and means local plugin changes take effect immediately without publishing.
    // CI passes no such property and falls through to the Maven Central coordinate instead.
    def jarDir = gradle.startParameter.projectProperties.get('docletmdJarDir')
    if (!jarDir) {
        repositories {
            mavenLocal()
            mavenCentral()
        }
    }
    dependencies {
        if (jarDir) {
            // listFiles() returns File[]; .findAll on a Java array returns a Groovy List<File>,
            // which files() accepts as an Iterable and converts to a FileCollection.
            def jars = new File(jarDir).listFiles()?.findAll { it.name.endsWith('.jar') } ?: []
            classpath files(jars)
        } else {
            classpath 'org.flixelgdx:docletmd:0.2.1'
        }
    }
}

import org.flixelgdx.docletmd.DocletMDPlugin
import org.flixelgdx.docletmd.DocletMDTask

def moduleSlugs = [
    'flixelgdx-core'   : 'core',
    'flixelgdx-lwjgl3' : 'lwjgl3',
    'flixelgdx-teavm'  : 'teavm',
    'flixelgdx-android': 'android',
]

allprojects { proj ->
    def slug = moduleSlugs[proj.name]
    if (slug == null) return

    def outBase = (rootProject.findProperty('docletmdOutDir') as String)
        ?: new File(rootProject.buildDir, 'docletmd-out').absolutePath

    // Java modules (core, lwjgl3, teavm): auto-wire via the java plugin source set and classpath.
    proj.plugins.withId('java') {
        proj.apply plugin: DocletMDPlugin

        proj.tasks.named('generateDocletMD', DocletMDTask) { task ->
            task.outputDir.set(new File(outBase, slug))

            // gdx-jnigen-loader splits com.badlogic.gdx.utils with gdx, causing a
            // split-package error in module-path mode. Patch the loader JAR into the
            // gdx module so the module system sees only one provider of that package.
            // Evaluated lazily so the configuration is not resolved at config time.
            task.additionalArgs.set(proj.provider {
                def jnigenJar = proj.configurations
                    .getByName('compileClasspath')
                    .resolvedConfiguration.resolvedArtifacts
                    .find { it.name.contains('jnigen-loader') }
                def jnigenArgs = jnigenJar ? ['--patch-module', "gdx=${jnigenJar.file.absolutePath}"] : []
                def sourceBase = "https://github.com/flixelgdx/flixelgdx/blob/master/${proj.name}/src/main/java/"
                jnigenArgs + ['-sourceBase', sourceBase]
            })
        }
    }

    // Android module: AGP does not apply the java plugin, so wire sources and classpath manually.
    // afterEvaluate is required so that AGP has finished registering its variants and tasks.
    proj.plugins.withId('com.android.library') {
        proj.apply plugin: DocletMDPlugin

        proj.afterEvaluate {
            proj.tasks.named('generateDocletMD', DocletMDTask) { task ->
                task.outputDir.set(new File(outBase, slug))

                task.sourceDirs.from(proj.android.sourceSets.getByName('main').java.srcDirs)

                // android.jar lives on AGP's bootClasspath, not the regular compile classpath.
                task.classpath.from(proj.android.bootClasspath)

                // For library dependencies (gdx-backend-android, etc.), borrow the classpath
                // that AGP has already configured on the release Javac task. AGP populates it
                // with extracted AAR contents, which resolving releaseCompileClasspath directly
                // would not provide because the AAR->JAR artifact transform does not fire
                // without the proper variant context.
                def javacTask = proj.tasks.findByName('compileReleaseJavaWithJavac')
                if (javacTask != null) {
                    task.classpath.from(javacTask.classpath)
                }

                task.additionalArgs.set(proj.provider {
                    def sourceBase = "https://github.com/flixelgdx/flixelgdx/blob/master/${proj.name}/src/main/java/"
                    ['-sourceBase', sourceBase]
                })
            }
        }
    }
}
